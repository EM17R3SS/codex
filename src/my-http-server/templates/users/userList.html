<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Управление пользователями | Node.js HTTP Server</title>
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <a href="/">NodeJS Server</a>
                </div>
                <ul class="nav-menu">
                    <li><a href="/">Главная</a></li>
                    <li><a href="/about">О нас</a></li>
                    <li><a href="/contact">Контакты</a></li>
                    <li><a href="/login">Вход</a></li>
                    <li>
                        <a href="/api/users" class="active">Пользователи</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="main">
            <div class="container">
                <div class="page-header">
                    <h1>Управление пользователями</h1>
                    <p>
                        Всего пользователей:
                        <span id="userCount">{{userCount}}</span>
                    </p>
                    <div class="header-actions">
                        <a
                            href="/api/users?format=json"
                            class="btn btn-secondary"
                            target="_blank"
                            >Получить JSON</a
                        >
                        <button
                            onclick="refreshUsers()"
                            class="btn btn-secondary"
                        >
                            Обновить
                        </button>
                    </div>
                </div>

                <div class="users-section">
                    <div class="add-user-form">
                        <h3>Добавить нового пользователя</h3>
                        <form id="addUserForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="userName">Имя</label>
                                    <input
                                        type="text"
                                        id="userName"
                                        placeholder="Иван Петров"
                                        required
                                    />
                                </div>
                                <div class="form-group">
                                    <label for="userEmail">Email</label>
                                    <input
                                        type="email"
                                        id="userEmail"
                                        placeholder="ivan@example.com"
                                        required
                                    />
                                </div>
                                <div class="form-group">
                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        Добавить пользователя
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="addUserMessage" class="form-message"></div>
                    </div>

                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>Email</th>
                                    <th>Дата регистрации</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="usersBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2026 Node.js HTTP Server. Все права защищены.</p>
            </div>
        </footer>

        <script>
            let usersData = [];

            try {
                usersData = JSON.parse("{{users}}");
            } catch (e) {
                usersData = [];
            }

            function renderUsers(users) {
                const tbody = document.getElementById("usersBody");
                const userCountSpan = document.getElementById("userCount");

                if (!tbody) return;

                if (!users || users.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="5" style="text-align: center;">Нет пользователей</td></tr>';
                    if (userCountSpan) userCountSpan.textContent = "0";
                    return;
                }

                tbody.innerHTML = "";
                users.forEach((user) => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = user.id;
                    row.insertCell(1).textContent = user.name || "—";
                    row.insertCell(2).textContent = user.email || "—";
                    row.insertCell(3).textContent = user.createdAt
                        ? new Date(user.createdAt).toLocaleString("ru-RU")
                        : "—";

                    const actionsCell = row.insertCell(4);
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Удалить";
                    deleteBtn.className = "btn-delete";
                    deleteBtn.onclick = () => deleteUser(user.id);
                    actionsCell.appendChild(deleteBtn);
                });

                if (userCountSpan) userCountSpan.textContent = users.length;
            }

            async function addUser(name, email) {
                try {
                    const response = await fetch("/api/users", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ name, email }),
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage(
                            "Пользователь успешно добавлен!",
                            "success",
                        );
                        refreshUsers();
                        return true;
                    } else {
                        showMessage("Ошибка: " + result.error, "error");
                        return false;
                    }
                } catch (error) {
                    showMessage("Ошибка при добавлении пользователя", "error");
                    return false;
                }
            }

            async function deleteUser(id) {
                if (
                    !confirm(
                        "Вы уверены, что хотите удалить этого пользователя?",
                    )
                )
                    return;
                try {
                    showMessage(
                        "Функция удаления будет добавлена в следующей версии",
                        "info",
                    );
                } catch (error) {
                    showMessage("Ошибка при удалении", "error");
                }
            }

            async function refreshUsers() {
                try {
                    const response = await fetch("/api/users?format=json");
                    const data = await response.json();
                    if (data.users) {
                        usersData = data.users;
                        renderUsers(usersData);
                        showMessage("Список обновлен", "success");
                    }
                } catch (error) {
                    showMessage("Ошибка при обновлении списка", "error");
                }
            }

            function showMessage(message, type) {
                const messageDiv = document.getElementById("addUserMessage");
                if (!messageDiv) return;

                messageDiv.textContent = message;
                messageDiv.className = `form-message ${type}`;

                setTimeout(() => {
                    messageDiv.textContent = "";
                    messageDiv.className = "form-message";
                }, 3000);
            }

            const addUserForm = document.getElementById("addUserForm");
            if (addUserForm) {
                addUserForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const name = document.getElementById("userName").value;
                    const email = document.getElementById("userEmail").value;

                    if (!name || !email) {
                        showMessage("Заполните все поля", "error");
                        return;
                    }

                    await addUser(name, email);
                    document.getElementById("userName").value = "";
                    document.getElementById("userEmail").value = "";
                });
            }

            renderUsers(usersData);
        </script>
    </body>
</html>
